name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone Windows app
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build_standalone.ps1

      - name: Archive Windows build
        shell: powershell
        run: |
          $releaseDir = "build\windows\SKRAFT View"
          $zipPath = "build\windows\SKRAFT-View-windows-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SKRAFT-View-windows-x64
          path: build/windows/SKRAFT-View-windows-x64.zip

      - name: Publish GitHub release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $asset = "build\windows\SKRAFT-View-windows-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --generate-notes --title $tag
          } else {
            gh release upload $tag $asset --clobber
          }
