name: Lint and Format

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.12,<1"

      - name: Run Ruff format check
        run: ruff format --check dashboard skraft_view launch_skraft_view.py manage.py

      - name: Run Ruff lint
        run: ruff check dashboard skraft_view launch_skraft_view.py manage.py

